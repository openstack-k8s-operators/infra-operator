#
# Step 2: Wait for upgrade to complete — cluster should be ready at version 4.2
#
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
timeout: 600
commands:
  - script: |
      set -e
      READY=$(oc get rabbitmq.rabbitmq.openstack.org -n $NAMESPACE rabbitmq-upgrade -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}')
      if [ "$READY" != "True" ]; then
        echo "FAIL: RabbitMq CR not ready after upgrade"
        exit 1
      fi
      echo "PASS: RabbitMq CR is ready"
  - script: |
      set -e
      # Verify currentVersion updated to 4.2
      VERSION=$(oc get rabbitmq.rabbitmq.openstack.org -n $NAMESPACE rabbitmq-upgrade -o jsonpath='{.status.currentVersion}')
      if [ "$VERSION" != "4.2" ]; then
        echo "FAIL: Expected currentVersion 4.2, got: $VERSION"
        exit 1
      fi
      echo "PASS: currentVersion is $VERSION"
  - script: |
      set -e
      # Verify upgradePhase is cleared
      PHASE=$(oc get rabbitmq.rabbitmq.openstack.org -n $NAMESPACE rabbitmq-upgrade -o jsonpath='{.status.upgradePhase}')
      if [ -n "$PHASE" ]; then
        echo "FAIL: upgradePhase should be empty after upgrade, got: $PHASE"
        exit 1
      fi
      echo "PASS: upgradePhase is cleared"
  - script: |
      set -e
      # Verify wipeReason is cleared
      REASON=$(oc get rabbitmq.rabbitmq.openstack.org -n $NAMESPACE rabbitmq-upgrade -o jsonpath='{.status.wipeReason}')
      if [ -n "$REASON" ]; then
        echo "FAIL: wipeReason should be empty after upgrade, got: $REASON"
        exit 1
      fi
      echo "PASS: wipeReason is cleared"
  - script: |
      set -e
      # Verify proxyRequired is NOT set (cluster was already on Quorum, no migration needed)
      PROXY=$(oc get rabbitmq.rabbitmq.openstack.org -n $NAMESPACE rabbitmq-upgrade -o jsonpath='{.status.proxyRequired}')
      if [ "$PROXY" = "True" ]; then
        echo "FAIL: proxyRequired should not be True for version-only upgrade on Quorum cluster, got: $PROXY"
        exit 1
      fi
      echo "PASS: proxyRequired is not set (no Mirrored→Quorum migration)"
  - script: |
      set -e
      # Verify proxy sidecar container is NOT present (no queue type migration)
      CONTAINERS=$(oc get statefulset -n $NAMESPACE rabbitmq-upgrade-server -o jsonpath='{.spec.template.spec.containers[*].name}')
      if echo "$CONTAINERS" | grep -qw "amqp-proxy"; then
        echo "FAIL: Proxy sidecar should not be present for version-only upgrade. Containers: $CONTAINERS"
        exit 1
      fi
      echo "PASS: No proxy sidecar (version-only upgrade): $CONTAINERS"
