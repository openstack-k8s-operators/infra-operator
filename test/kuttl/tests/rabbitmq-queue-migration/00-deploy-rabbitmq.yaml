#
# Step 0: Deploy RabbitMq with Mirrored queue type
#
apiVersion: rabbitmq.openstack.org/v1beta1
kind: RabbitMq
metadata:
  name: rabbitmq-qmigrate
spec:
  replicas: 3
  containerImage: quay.io/openstack-s2i-containers/openstack-rabbitmq:master-latest
  terminationGracePeriodSeconds: 30
  queueType: Mirrored
