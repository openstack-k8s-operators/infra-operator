apiVersion: rabbitmq.openstack.org/v1beta1
kind: RabbitMq
metadata:
  name: rabbitmq-tls
spec:
  replicas: 1
  containerImage: quay.io/openstack-s2i-containers/openstack-rabbitmq:master-latest
  terminationGracePeriodSeconds: 30
  tls:
    secretName: rabbitmq-tls-cert
    caSecretName: rabbitmq-tls-ca
