apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - script: |
      # The KUTTL cluster contract does not guarantee Medik8s CRDs. Install only
      # the API schemas needed by this synthetic integration fixture, and leave
      # any CRD already supplied by the cluster untouched.
      if ! oc get crd nodehealthchecks.remediation.medik8s.io >/dev/null 2>&1; then
        oc create -f - <<'EOF'
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata:
        name: nodehealthchecks.remediation.medik8s.io
      spec:
        group: remediation.medik8s.io
        names:
          plural: nodehealthchecks
          singular: nodehealthcheck
          kind: NodeHealthCheck
          listKind: NodeHealthCheckList
        scope: Cluster
        versions:
          - name: v1alpha1
            served: true
            storage: true
            schema:
              openAPIV3Schema:
                type: object
                x-kubernetes-preserve-unknown-fields: true
      EOF
        oc label crd nodehealthchecks.remediation.medik8s.io podremediator-kuttl-created=true
      fi
      if ! oc get crd selfnoderemediationtemplates.self-node-remediation.medik8s.io >/dev/null 2>&1; then
        oc create -f - <<'EOF'
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata:
        name: selfnoderemediationtemplates.self-node-remediation.medik8s.io
      spec:
        group: self-node-remediation.medik8s.io
        names:
          plural: selfnoderemediationtemplates
          singular: selfnoderemediationtemplate
          kind: SelfNodeRemediationTemplate
          listKind: SelfNodeRemediationTemplateList
        scope: Namespaced
        versions:
          - name: v1alpha1
            served: true
            storage: true
            schema:
              openAPIV3Schema:
                type: object
                x-kubernetes-preserve-unknown-fields: true
      EOF
        oc label crd selfnoderemediationtemplates.self-node-remediation.medik8s.io podremediator-kuttl-created=true
      fi
      if ! oc get crd selfnoderemediations.self-node-remediation.medik8s.io >/dev/null 2>&1; then
        oc create -f - <<'EOF'
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata:
        name: selfnoderemediations.self-node-remediation.medik8s.io
      spec:
        group: self-node-remediation.medik8s.io
        names:
          plural: selfnoderemediations
          singular: selfnoderemediation
          kind: SelfNodeRemediation
          listKind: SelfNodeRemediationList
        scope: Namespaced
        versions:
          - name: v1alpha1
            served: true
            storage: true
            subresources:
              status: {}
            schema:
              openAPIV3Schema:
                type: object
                x-kubernetes-preserve-unknown-fields: true
      EOF
        oc label crd selfnoderemediations.self-node-remediation.medik8s.io podremediator-kuttl-created=true
      fi
      oc wait --for=condition=Established crd/nodehealthchecks.remediation.medik8s.io --timeout=120s
      oc wait --for=condition=Established crd/selfnoderemediationtemplates.self-node-remediation.medik8s.io --timeout=120s
      oc wait --for=condition=Established crd/selfnoderemediations.self-node-remediation.medik8s.io --timeout=120s
