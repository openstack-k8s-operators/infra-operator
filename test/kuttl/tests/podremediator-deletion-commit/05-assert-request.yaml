apiVersion: kuttl.dev/v1beta1
kind: TestAssert
timeout: 180
commands:
  - script: |
      CLAIM=data-podremediator-lease-0
      for attempt in $(seq 1 90); do
        node=$(oc get pvc "$CLAIM" -n "$NAMESPACE" -o jsonpath='{.metadata.annotations.remediation\.openstack\.org/pvc-stuck-on-node}' 2>/dev/null || true)
        request=$(oc get pvc "$CLAIM" -n "$NAMESPACE" -o jsonpath='{.metadata.annotations.remediation\.openstack\.org/request-id}' 2>/dev/null || true)
        if [ "$node" = "podremediator-lease-node" ] && [ -n "$request" ]; then
          exit 0
        fi
        sleep 2
      done
      echo "PodRemediator did not start the consent request after the synthetic SNR reached Fencing-Completed"
      oc get pvc "$CLAIM" -n "$NAMESPACE" -o yaml || true
      exit 1
