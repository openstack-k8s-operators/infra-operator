# This patch inject custom ENV settings to the manager container
# Used to set our default image locations
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
spec:
  template:
    spec:
      containers:
      - name: manager
        env:
        - name: RELATED_IMAGE_INFRA_MEMCACHED_IMAGE_URL_DEFAULT
          value: quay.io/openstack-s2i-containers/openstack-memcached:master-latest
        - name: RELATED_IMAGE_INFRA_REDIS_IMAGE_URL_DEFAULT
          value: quay.io/openstack-s2i-containers/openstack-redis:master-latest
        # TODO create its own container image, instead of using neutron one
        - name: RELATED_IMAGE_INFRA_DNSMASQ_IMAGE_URL_DEFAULT
          value: quay.io/openstack-s2i-containers/openstack-neutron-server:master-latest
        - name: RELATED_IMAGE_INSTANCE_HA_IMAGE_URL_DEFAULT
          value: quay.io/openstack-s2i-containers/openstack-openstackclient:master-latest
